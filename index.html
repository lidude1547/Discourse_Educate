<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小手小腳大冒險</title>
<meta name="description" content="給 0–6 歲孩子與爸媽的動作發展動畫:粗大動作、精細動作、掌內操弄與居家遊戲。">
<meta property="og:title" content="小手小腳大冒險">
<meta property="og:description" content="給 0–6 歲孩子與爸媽的動作發展動畫">
<meta property="og:image" content="poster.jpg">
<meta property="og:type" content="video.other">
<style>
  :root { --ink:#2b2340; --bg:#fff6e2; --card:#ffffff; --accent:#ff636e; --sel:#ffd23f; --muted:#6b6380; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ink:#f4efff; --bg:#1d1a2b; --card:#2a2640; --muted:#b8b0d0; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif; }
  main { max-width:1200px; margin:0 auto; padding:20px 16px 40px; }
  h1 { margin:0 0 14px; font-size:clamp(24px,4vw,40px); letter-spacing:2px; }
  video { width:100%; border-radius:18px; border:4px solid var(--ink); background:#000; display:block; }
  .bar { margin-top:16px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; background:var(--card); border:3px solid var(--ink); border-radius:18px; padding:12px 14px; }
  .label { font-weight:700; font-size:20px; margin-right:6px; }
  button { font:inherit; font-size:22px; font-weight:700; min-width:84px; padding:10px 16px; border-radius:14px; border:3px solid var(--ink); background:var(--card); color:var(--ink); cursor:pointer; }
  button:hover { transform:translateY(-1px); }
  button[aria-pressed="true"] { background:var(--sel); color:#2b2340; }
  .now { margin-left:auto; font-size:20px; font-weight:700; }
  .err { display:none; margin-top:14px; padding:12px 14px; border-radius:12px; background:var(--accent); color:#fff; font-size:18px; }
  .tip { margin-top:10px; color:var(--muted); font-size:16px; }
  @media (max-width:600px){ button{min-width:64px;font-size:18px;padding:8px 10px} .now{margin-left:0;width:100%} }
</style>
</head>
<body>
<main>
  <h1>小手小腳大冒險</h1>
  <video id="v" src="video.mp4" poster="poster.jpg" controls preload="metadata" playsinline></video>
  <div class="bar" role="group" aria-label="播放速度">
    <span class="label">播放速度</span>
    <button data-r="0.5">0.5×</button>
    <button data-r="0.75">0.75×</button>
    <button data-r="1">1×</button>
    <button data-r="1.25">1.25×</button>
    <button data-r="1.5">1.5×</button>
    <button data-r="2">2×</button>
    <span class="now" id="now">目前:1×</span>
  </div>
  <div class="err" id="err">影片載入失敗,請重新整理頁面再試一次。</div>
  <p class="tip"><a href="video.mp4" download="小手小腳大冒險.mp4" style="color:inherit;font-weight:700">⬇ 下載影片</a> · 鍵盤:空白鍵 播放/暫停 · 「-」放慢 · 「+」加快 · 「0」恢復 1× · F 全螢幕</p>
</main>
<script>
  const v = document.getElementById('v'), now = document.getElementById('now');
  const btns = [...document.querySelectorAll('button[data-r]')];
  const rates = btns.map(b => +b.dataset.r);
  v.preservesPitch = true; v.mozPreservesPitch = true; v.webkitPreservesPitch = true;
  function setRate(r) {
    v.playbackRate = r;
    btns.forEach(b => b.setAttribute('aria-pressed', +b.dataset.r === r ? 'true' : 'false'));
    now.textContent = '目前:' + r + '×';
    try { localStorage.setItem('rate', r); } catch (e) {}
  }
  btns.forEach(b => b.addEventListener('click', () => setRate(+b.dataset.r)));
  let saved = 1;
  try { saved = +localStorage.getItem('rate') || 1; } catch (e) {}
  setRate(rates.includes(saved) ? saved : 1);
  v.addEventListener('ratechange', () => {
    const r = v.playbackRate;
    btns.forEach(b => b.setAttribute('aria-pressed', +b.dataset.r === r ? 'true' : 'false'));
    now.textContent = '目前:' + r + '×';
  });
  v.addEventListener('error', () => { document.getElementById('err').style.display = 'block'; });
  document.addEventListener('keydown', e => {
    const i = rates.indexOf(v.playbackRate);
    if (e.key === ' ' && e.target === document.body) { e.preventDefault(); v.paused ? v.play() : v.pause(); }
    else if (e.key === '-' || e.key === '_') setRate(rates[Math.max(0, (i < 0 ? 2 : i) - 1)]);
    else if (e.key === '+' || e.key === '=') setRate(rates[Math.min(rates.length - 1, (i < 0 ? 2 : i) + 1)]);
    else if (e.key === '0') setRate(1);
    else if (e.key === 'f' || e.key === 'F') { document.fullscreenElement ? document.exitFullscreen() : v.requestFullscreen(); }
  });
</script>
</body>
</html>
